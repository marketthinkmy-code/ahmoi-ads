# ─────────────────────────────────────────────────────────────────────────────
# adbot — config for MOI FU MONEY BLUEPRINT (copied from soocheng-ads, owner 2026-11-09)
# Structure / guardrail logic / cron identical to soocheng-ads; only the values below differ.
# ⚠ items marked TODO must be confirmed before the first live build.
# ─────────────────────────────────────────────────────────────────────────────

meta:
  ad_account_id: "act_2165219017411034"           # «Ah Moi 666», MYR — verified readable 2026-11-09 (campaigns since 2 NOV 2026); System User still needs access
  page_id: "1285525351321816"
  instagram_user_id: "17841438769308083"
  pixel_id: "1654213532722358"

  objective: "OUTCOME_SALES"
  optimization_goal: "OFFSITE_CONVERSIONS"
  conversion_event: "COMPLETE_REGISTRATION"
  custom_conversions: []                          # TODO: if registrations come from Webinarkit, add its custom conversion id (SB uses one)
  special_ad_categories: ["FINANCIAL_PRODUCTS_SERVICES"]   # financial vertical; Meta may force broad age/targeting

  lead_destination:
    type: "WEBSITE"
    link_url: "https://fumoneyblueprint.com/register-page"
  conversion_domain: "https://fumoneyblueprint.com/"
  call_to_action: "LEARN_MORE"
  url_tags: "utm_source={{adset.name}}&utm_medium={{placement}}&utm_campaign={{campaign.name}}&utm_content={{ad.name}}"

  budget:
    level: "CAMPAIGN"                    # CBO
    daily_amount_myr: 300                # owner 2026-11-09
    currency: "MYR"                      # account currency confirmed MYR
    adset_min_spend_myr: 50

  targeting:
    countries: ["MY", "SG"]              # combined for now; owner will split MY / SG later
    age_min: 28
    age_max: 55                          # with advantage_audience 1 this is a suggestion; the financial category may widen it
    advantage_audience: 1
    locales: [1004]                      # Chinese (All)
    excluded_custom_audiences: []

  build:
    creatives_per_adset: 10
    activate_after_build: false          # always build PAUSED; owner activates after review

naming:
  prefix: "MOI"                          # names what the bot builds; the monitor + weekly OFF/ON still cover the WHOLE account (owner 2026-11-09「bot 要管整个帐户」)
  weekly_off_label: "ADBOT_WEEKLY_OFF"

drive:
  creatives_folder_id: "1cemMVoa2IWSQSiPSVVQ_-p2avVhWXbtP"   # "ECOM- MOI / 自動跑" — creatives-only folder (owner 2026-11-09)
  carousel_subfolder_marker: "carousel"
  script_sidecar_ext: ".txt"

google_docs:
  caption_log_doc_id: ""
  idea_backlog_doc_id: ""

notion:
  enabled: false                         # no MOI content-pipeline DB wired yet
  database_id: ""

kpi:
  # Owner 2026-11-09: target CPL MY < RM30, SG < RM50. MY+SG currently run in the same ads and adbot has ONE
  # line per account, so use RM40 until MY / SG are split (then: MY 30 / SG 50, needs per-campaign lines).
  cpl_threshold_myr: 40.00
  cpl_min_spend_myr: 60.00               # judge an ad only after it spends 1.5x the line (same rule as SB)
  cpl_lookback: "week_thu"
  pause_zero_lead_after_spend: true
  cpl_soft_reduce: false                 # plain pause (SB's "cut 30% first" is a temporary SB-only rule)
  cpl_reduce_pct: 0.30
  cpl_reduce_floor_myr: 30.00
  cpl_hold: []

cpa:
  enabled: true
  spreadsheet_id: "1_SX430GhrMn8cjQ4SXaSa76Yayb4Ltln4TC8XTHG1WY"   # "Ah Moi funnel Register and Purchase list"
  sales_tab: "付款学员"                  # the tab is named 付款学员 (not "Paid Student List"); campaign = "source" column
  price_myr: 1997.00
  target_myr: 700.00                     # owner 2026-11-09 (ROAS 3 = 666)
  healthy_max_myr: 780.00
  max_acceptable_myr: 900.00             # pause candidate (report only)
  hard_stop_myr: 1000.00                 # auto-pause line (ROAS 2.0), only with real sales + matured
  conversion_days: 14
  min_spend_myr: 1000.00
  hold: []

schedule:
  timezone: "Asia/Kuala_Lumpur"
  weekly_off: { day: "WED", time: "15:00" }
  weekly_on:  { day: "THU", time: "00:00" }
  monitor_interval_hours: 1

compliance:
  banned_creatives: []                   # MOI starts clean; add any creative Meta ever rejects (never resubmit)
